name: tutorial1
on: workflow_dispatch

jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
    - name: set up python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
  job2:
    name: job2
    runs-on: windows-latest
    steps:
    - name: step2
      run: echo "Hello from windows"
  job3:
    name: job3
    needs: [job1, job2]
    runs-on: ubuntu-latest
    steps:
    - name: step3
      run: echo "Hello from job 3"
